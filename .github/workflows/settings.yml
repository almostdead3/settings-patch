name: Settings.apk inspect

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty = latest release)"
        required: false
        default: ""
      asset:
        description: "APK name in the release assets"
        required: true
        default: "Settings.apk"

permissions:
  contents: read

env:
  APKTOOL_VERSION: "2.9.3"
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  ASSET: ${{ inputs.asset }}
  TAG: ${{ inputs.tag }}

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download APK from this repo's release
        run: |
          mkdir -p work
          if [ -n "$TAG" ]; then
            gh release download "$TAG" -R "${{ github.repository }}" -p "$ASSET" -D work --clobber
          else
            gh release download -R "${{ github.repository }}" -p "$ASSET" -D work --clobber
          fi
          ls -lh work

      - name: Install apktool
        run: |
          curl -fL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"
          printf '#!/bin/sh\nexec java -Xmx3g -jar "%s/apktool.jar" "$@"\n' "$PWD" | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool

      - name: Install ROM framework APKs (optional)
        run: |
          # Optional: put framework-res.apk and oplus/oneplus framework APKs in frameworks/
          if ls frameworks/*.apk >/dev/null 2>&1; then
            for f in frameworks/*.apk; do apktool if "$f"; done
          fi

      - name: Decompile (resources and smali)
        run: |
          cd work
          apktool d "$ASSET" -o src -f

      - name: Analyse
        run: |
          mkdir -p inspect
          python3 - <<'PY' > inspect/report.txt
          import re, glob, os

          SRC = 'work/src'
          layouts = sorted(glob.glob(f'{SRC}/res/layout*/*.xml'))

          # public.xml: layout name -> hex id
          pub = open(f'{SRC}/res/values/public.xml', errors='ignore').read()
          layout_ids = dict(re.findall(r'<public type="layout" name="([^"]+)" id="(0x[0-9a-fA-F]+)"', pub))

          print("=== 1. Layouts with an element id/icon_frame (tag shown) ===")
          cands = []
          for f in layouts:
              s = open(f, errors='ignore').read()
              m = re.search(r'<([\w.]+)((?:(?!<)[\s\S])*?)@(?:\+)?id/icon_frame', s)
              if m:
                  root = re.search(r'<([\w.]+)', s).group(1)
                  print(f"{f.replace(SRC+'/','')}  icon_frame=<{m.group(1)}>  root=<{root}>")
                  cands.append((f, m.group(1)))
          print()

          print("=== 2. Same, only where icon_frame is a LinearLayout (suspects) ===")
          suspects = [f for f, t in cands if t.endswith('LinearLayout')]
          for f in suspects:
              print(f.replace(SRC+'/', ''))
          print()

          print("=== 3. Full text of suspect layouts (max 15) ===")
          for f in suspects[:15]:
              print(f"----- {f.replace(SRC+'/','')} -----")
              print(open(f, errors='ignore').read())
          print()

          print("=== 4. Smali that references suspect layouts by id ===")
          for f in suspects:
              name = os.path.basename(f)[:-4]
              hid = layout_ids.get(name)
              if not hid:
                  continue
              hits = os.popen(f"grep -rln '{hid}' {SRC}/smali* 2>/dev/null | head -10").read().strip()
              print(f"{name} ({hid}):\n{hits or '  (no direct smali reference)'}")
          print()

          print("=== 5. Lines mentioning google in res/xml ===")
          for f in sorted(glob.glob(f'{SRC}/res/xml*/*.xml')):
              for line in open(f, errors='ignore'):
                  if re.search(r'google', line, re.I):
                      print(f"{f.replace(SRC+'/','')}: {line.strip()[:200]}")
          print()

          print("=== 6. setLayoutResource in dashboard/tile/homepage smali ===")
          print(os.popen(f"grep -rn 'setLayoutResource' {SRC}/smali* 2>/dev/null | grep -i 'tile\\|dashboard\\|homepage\\|google' | head -60").read())
          PY
          wc -l inspect/report.txt
          head -120 inspect/report.txt

      - name: Collect resources
        run: |
          cd work/src
          cp AndroidManifest.xml ../../inspect/ || true
          for d in res/layout* res/xml* res/values* res/drawable*; do
            [ -d "$d" ] && cp -r --parents "$d" ../../inspect/ || true
          done
          cd ../..
          zip -qr inspect.zip inspect
          ls -lh inspect.zip

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: inspect
          path: inspect.zip
          if-no-files-found: error
